<!DOCTYPE html><html><head><meta charset="utf-8"><title>File Reader</title><style>body{font-family:sans-serif}pre{border:1px solid #ccc;padding:8px;white-space:pre-wrap;word-break:break-all;background:#f6f8fa}h2{margin:8px 0 2px}</style></head><body><h1>Granted File Reader</h1><input type="file" id="f"><div id="meta">waiting for file</div><div id="chunks"></div><script>var f=document.getElementById('f');f.addEventListener('change',function(){var b=f.files[0];if(!b)return;var r=new FileReader();r.onload=function(){var t=r.result;document.getElementById('meta').textContent='LEN='+t.length+' NAME='+b.name;var d=document.getElementById('chunks');d.innerHTML='';var n=Math.ceil(t.length/4000);for(var i=0;i<n;i++){var h=document.createElement('h2');h.textContent='CHUNK '+i+' of '+n;d.appendChild(h);var p=document.createElement('pre');p.id='c'+i;p.textContent=t.slice(i*4000,(i+1)*4000);d.appendChild(p);}};r.readAsText(b);});</script></body></html>
